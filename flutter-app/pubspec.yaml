name: volunteerbridge
description: AI-powered volunteer coordination mobile app for VolunteerBridge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  google_maps_flutter: ^2.6.0
  geolocator: ^12.0.0
  http: ^1.2.1
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
